name: Amazon Deals Bot (IL)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run-deals-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deals bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_FEED_URLS: ${{ secrets.AMAZON_FEED_URLS }}
          MAX_PRICE_USD: "74.9"
          FREE_SHIPPING_THRESHOLD_USD: "49.0"
          REQUIRE_FREE_SHIPPING: "true"
        run: python bot_sender.py

      - name: Commit updated posted_asins.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f posted_asins.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update posted_asins.json"
            git push
          fi
